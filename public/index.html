<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marix</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #1a1d2e;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #20243a 0%, #161927 100%);
        color: #e2e8f0;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        z-index: 9999;
        transition: opacity 220ms ease;
      }

      #boot-splash.hide {
        opacity: 0;
        pointer-events: none;
      }

      .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .boot-spinner {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 3px solid rgba(94, 234, 212, 0.25);
        border-top-color: #2dd4bf;
        animation: spin 0.8s linear infinite;
      }

      .boot-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .boot-subtitle {
        font-size: 12px;
        color: #94a3b8;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
</head>
<body>
    <div id="boot-splash">
      <div class="boot-card">
        <div class="boot-spinner"></div>
        <div class="boot-title">Marix</div>
        <div class="boot-subtitle">Starting…</div>
      </div>
    </div>
    <div id="root"></div>
</body>
</html>
